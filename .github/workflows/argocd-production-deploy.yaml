---
name: ArgoCD Production Deployment

on:
  push:
    branches: [main]
    paths: [kubernetes/**]
  workflow_dispatch:

jobs:
  argocd-deploy:
    runs-on: ubuntu-latest
    env:
      ARGOCD_SERVER: argocd.cow-banjo.ts.net
      ARGOCD_OPTS: --grpc-web

    steps:
    - name: Wait for previous deployments
      uses: softprops/turnstyle@3805450be63b8c80577dc253e8c17e9132036df4  # v3.3.3

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Detect Changed Apps
      if: github.event_name == 'push'
      id: detect
      env:
        BASE_REF: ${{ github.event.before }}
        HEAD_REF: ${{ github.sha }}
      run: |
        set -euo pipefail
        git fetch --no-tags --prune origin "+${BASE_REF}" || true
        git fetch --no-tags --prune origin "+${HEAD_REF}" || true
        "${GITHUB_WORKSPACE}/scripts/argocd-detect-apps" \
          --base-ref "$BASE_REF" \
          --head-ref "$HEAD_REF" \
          --scan-root "$GITHUB_WORKSPACE"

    - name: Connect to Tailscale
      if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.apps !=
        ''
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        tags: tag:github-actions
        use-cache: true

    - name: Cache ArgoCD CLI
      if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.apps !=
        ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ${{ github.workspace }}/.cache/argocd/cli
        key: argocd-cli-${{ runner.os }}-v1

    - name: Install ArgoCD CLI
      if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.apps !=
        ''
      run: |
        set -euo pipefail
        CACHE="${GITHUB_WORKSPACE}/.cache/argocd"
        BIN="$CACHE/cli"
        mkdir -p "$CACHE"
        if [[ ! -f "$BIN" ]]; then
          echo "Downloading ArgoCD CLI"
          curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-connrefused \
            --retry-delay 2 \
            --retry-max-time 60 \
            -o "$BIN" \
            https://argocd.cow-banjo.ts.net/download/argocd-linux-amd64
          chmod +x "$BIN"
        else
          echo "Using cached ArgoCD CLI"
        fi
        sudo cp "$BIN" /usr/local/bin/argocd

    - name: List Apps for Manual Deployment
      if: github.event_name == 'workflow_dispatch'
      id: manual
      env:
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      run: |
        set -euo pipefail
        apps=$(argocd app list -o name | sed 's|argocd/||g' | tr '\n' ' ' | sed 's/ $//')
        echo "Found applications: $apps"
        echo "apps=$apps" >> "$GITHUB_OUTPUT"

    - name: Report no changed apps
      if: steps.detect.outputs.apps == '' && steps.manual.outputs.apps == ''
      run: echo "No ArgoCD applications detected in changed files - nothing to deploy."

    - name: Deploy Applications to Main
      if: steps.detect.outputs.apps != '' || steps.manual.outputs.apps != ''
      env:
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        DETECTED_APPS: ${{ steps.detect.outputs.apps || steps.manual.outputs.apps }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |-
        "${GITHUB_WORKSPACE}/scripts/argocd-deploy" \
          --apps "$DETECTED_APPS" \
          --target-revision "main" \
          --action-run-url "$SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
