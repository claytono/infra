---
name: Fix Linting Issues in Renovate PRs

# This workflow automatically fixes linting issues in Renovate PRs by running
# pre-commit hooks and committing the fixes back to the PR. This prevents
# CI failures due to formatting issues that can be automatically resolved.
#
# The workflow only runs on Renovate PRs and uses the same PAT token as the
# render-helm workflow for authentication.

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-linting:
    name: Fix Linting Issues
    runs-on: ubuntu-latest
    # Only run on Renovate PRs
    if: contains(github.event.pull_request.user.login, 'renovate')

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT }}
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Install Nix
      uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Cachix
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
      with:
        name: claytono
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Cache pre-commit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}

    # ansible-lint performs a project-wide syntax check even when fixing one
    # changed file, so it needs the configured password to read vaulted vars.
    - name: Write vault password file
      run: |
        umask 077
        printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > ansible/ansible-vault-password
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

    # A plain `pre-commit run` checks staged files, but an Actions checkout has
    # none. Select the Renovate PR's changed files using the same range as CI.
    # Hooks exit nonzero after applying fixes, so continue and commit the diff.
    - name: Run pre-commit hooks on changed files
      run: nix develop --command ./scripts/lint --from-ref "$LINT_BASE_REF" --to-ref
        "$LINT_HEAD_REF" || true
      env:
        SKIP: terraform_validate,terraform_providers_lock
        GH_TOKEN: ${{ github.token }}
        LINT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        LINT_HEAD_REF: ${{ github.event.pull_request.head.sha }}

    - name: Check for changes
      id: check-changes
      run: |
        if ! git diff --quiet; then
          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "Linting fixes detected:"
          git diff --stat
        else
          echo "changes=false" >> "$GITHUB_OUTPUT"
          echo "No linting fixes needed"
        fi

    - name: Commit and push fixes
      if: steps.check-changes.outputs.changes == 'true'
      env:
        BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Auto-fix hooks only modify tracked input files. Stage those paths
        # explicitly instead of sweeping unrelated files into the commit.
        git diff --name-only -z | xargs -0 git add --
        git commit -m "Fix linting issues

        Apply fixes produced by the repository's pre-commit hooks."

        echo "Pushing fixes to branch: $BRANCH_NAME"
        git push "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}" "HEAD:$BRANCH_NAME"
