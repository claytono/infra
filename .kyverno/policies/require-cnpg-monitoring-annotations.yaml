---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-cnpg-monitoring-annotations

spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [postgresql.cnpg.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [clusters]
  validations:
  - expression: >-
      object.spec.?inheritedMetadata.?annotations[?'prometheus.io/scrape']
      .orValue('') == 'true' &&
      object.spec.?inheritedMetadata.?annotations[?'prometheus.io/port']
      .orValue('') == '9187'
    message: >-
      Database clusters must set prometheus.io/scrape to 'true' and
      prometheus.io/port to '9187' under spec.inheritedMetadata.annotations
      so Prometheus monitors their pods.
