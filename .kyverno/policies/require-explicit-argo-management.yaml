---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-explicit-argo-management

spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [kustomize.config.k8s.io]
      apiVersions: ['*']
      operations: [CREATE, UPDATE]
      resources: [kustomizations]
  validations:
  - expression: >-
      string(object.?commonAnnotations.?argoManaged.orValue('')) in
      ['true', 'false']
    message: >-
      Top-level application Kustomizations must set
      commonAnnotations.argoManaged to either 'true' or 'false'.
