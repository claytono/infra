---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-iscsi-backup-label

spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [persistentvolumeclaims]
  matchConditions:
  - name: synology-iscsi
    expression: object.spec.?storageClassName.orValue('') == 'synology-iscsi'
  validations:
  - expression: >-
      object.metadata.?labels[?'velero.io/backup'].orValue('') in
      ['true', 'false']
    message: >-
      PVCs using synology-iscsi storage class must have the label
      velero.io/backup set to either 'true' or 'false'.
      This enforces explicit backup policy for iSCSI volumes.
