---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-kustomization-namespace

spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [kustomize.config.k8s.io]
      apiVersions: ['*']
      operations: [CREATE, UPDATE]
      resources: [kustomizations]
  matchConditions:
  - name: not-skipped
    expression: >-
      object.metadata.?annotations[?'kyverno.io/skip-namespace']
      .orValue('') != 'true'
  validations:
  - expression: object.?namespace.orValue('') != ''
    message: >-
      Kustomization files must have a 'namespace' field set to ensure
      resources are applied to the correct namespace.
