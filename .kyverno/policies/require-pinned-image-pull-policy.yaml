---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-pinned-image-pull-policy

spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  variables:
  - name: containers
    expression: >-
      object.spec.?containers.orValue([]) +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: >-
      variables.containers.all(container,
      !container.?image.orValue('').contains('@sha256:') ||
      (has(container.imagePullPolicy) ?
      container.imagePullPolicy == 'IfNotPresent' :
      !container.image.contains(':latest@sha256:')))
    message: >-
      Images pinned by digest must omit imagePullPolicy or set it to
      IfNotPresent. Images using a latest tag must set it explicitly.
