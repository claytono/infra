- name: Verify setup
  hosts: all
  vars:
    containerd__nginx_version: "1.24"
    # Molecule verifier doesn't automatically load role defaults, so provide
    # safe fallbacks and discover the actual containerd binary path.
    containerd__config_directory: "{{ containerd_config_directory | default('/etc/containerd') }}"
    containerd__candidate_binaries:
      - "{{ (containerd_binary_directory | default('/usr/local/sbin')) }}/containerd"
      - "{{ (containerd_binary_directory | default('/usr/local/bin')) }}/containerd"
      - "/usr/local/sbin/containerd"
      - "/usr/local/bin/containerd"
      - "/usr/bin/containerd"
  tasks:
    - name: Locate containerd binary
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ containerd__candidate_binaries }}"
      register: containerd__binary_stats
      changed_when: false

    - name: Set containerd binary path
      ansible.builtin.set_fact:
        containerd__binary_path: "{{ (containerd__binary_stats.results | selectattr('stat.exists', '==', True) | map(attribute='stat.path') | first) }}"

    - name: Assert containerd binary found
      ansible.builtin.assert:
        that:
          - containerd__binary_path is defined
          - containerd__binary_path | length > 0
        fail_msg: "containerd binary not found in candidate paths: {{ containerd__candidate_binaries }}"

    - name: Check installed containerd version
      ansible.builtin.command:
        cmd: "{{ containerd__binary_path }} --version"
      register: containerd__version_output
      changed_when: false

    - name: Assert containerd version is 2.4.1
      ansible.builtin.assert:
        that:
          - "' v2.4.1 ' in containerd__version_output.stdout"
        fail_msg: "Unexpected containerd version: {{ containerd__version_output.stdout }}"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert containerd service is running and enabled
      ansible.builtin.assert:
        that:
          - "'containerd.service' in ansible_facts.services"
          - "ansible_facts.services['containerd.service'].state == 'running'"
          - "ansible_facts.services['containerd.service'].status == 'enabled'"

    - name: Check containerd socket
      ansible.builtin.stat:
        path: /run/containerd/containerd.sock
      register: containerd__socket

    - name: Assert containerd socket exists
      ansible.builtin.assert:
        that:
          - containerd__socket.stat.issock | default(false)

    - name: List containerd plugins
      ansible.builtin.command:
        cmd: ctr plugins ls
      register: containerd__plugins
      changed_when: false

    - name: Assert CRI runtime and image plugins are healthy
      ansible.builtin.assert:
        that:
          - "containerd__plugins.stdout is regex('(?m)^io.containerd.cri.v1\\s+runtime\\s+.*\\s+ok\\s*$')"
          - "containerd__plugins.stdout is regex('(?m)^io.containerd.cri.v1\\s+images\\s+.*\\s+ok\\s*$')"
        fail_msg: "CRI plugins not healthy: {{ containerd__plugins.stdout }}"

    - name: Verify conf.d imports behavior
      when: inventory_hostname == 'test-cd-ubuntu2404-conf-d'
      block:
        - name: Read containerd main config
          ansible.builtin.slurp:
            src: "{{ containerd__config_directory }}/config.toml"
          register: containerd_config_toml

        - name: Ensure imports are configured in main config
          ansible.builtin.assert:
            that:
              - "(containerd_config_toml.content | b64decode) is regex('(?m)^\\s*imports\\s*=\\s*\\[.*conf\\.d/\\*\\.toml.*\\]')"

        - name: Ensure conf.d drop-in file exists
          ansible.builtin.stat:
            path: "{{ containerd__config_directory }}/conf.d/10-molecule.toml"
          register: containerd_dropin_stat

        - name: Assert conf.d drop-in file exists
          ansible.builtin.assert:
            that:
              - containerd_dropin_stat.stat.exists

        - name: Dump containerd config (main + imports)
          ansible.builtin.command:
            cmd: "{{ containerd__binary_path }} --config {{ containerd__config_directory }}/config.toml config dump"
          register: containerd_config_dump
          changed_when: false

        - name: Ensure conf.d drop-in override is present
          ansible.builtin.assert:
            that:
              - "containerd_config_dump.stdout is regex('(?m)^\\s*max_container_log_line_size\\s*=\\s*32768\\s*$')"

    - name: Pull nginx image with ctr
      ansible.builtin.command:
        cmd: "ctr images pull docker.io/library/nginx:{{ containerd__nginx_version }}"
      register: ctr_pull_output
      changed_when: false

    - name: Ensure ctr output contains correct string
      ansible.builtin.assert:
        that:
          - "'saved' in ctr_pull_output.stdout"

    - name: List existing tasks before nginx test
      ansible.builtin.command:
        cmd: ctr tasks ls
      register: containerd__existing_tasks
      changed_when: false

    - name: Remove stale nginx task
      ansible.builtin.command:
        cmd: ctr tasks delete --force nginx
      when: containerd__existing_tasks.stdout is regex('(?m)^nginx\s')
      changed_when: false

    - name: List existing containers before nginx test
      ansible.builtin.command:
        cmd: ctr containers ls
      register: containerd__existing_containers
      changed_when: false

    - name: Remove stale nginx container and snapshot
      ansible.builtin.command:
        cmd: ctr containers delete nginx
      when: containerd__existing_containers.stdout is regex('(?m)^nginx\s')
      changed_when: false

    - name: Verify nginx container lifecycle
      block:
        - name: Start nginx with ctr
          ansible.builtin.command:
            cmd: "ctr run -d -t docker.io/library/nginx:{{ containerd__nginx_version }} nginx"
          changed_when: false

        - name: List containers
          ansible.builtin.command:
            cmd: "ctr containers ls"
          register: ctr_ls_output
          changed_when: false

        - name: Ensure nginx container running
          ansible.builtin.assert:
            that:
              - "'nginx' in ctr_ls_output.stdout"

        - name: Run curl in nginx container
          ansible.builtin.command:
            cmd: "ctr task exec --exec-id curl -- nginx curl -sfS 127.0.0.1:80"
          register: ctr_task_output
          changed_when: false

        - name: Ensure curl command was successful
          ansible.builtin.assert:
            that:
              - "'Welcome to nginx' in ctr_task_output.stdout"
      always:
        - name: List tasks after nginx test
          ansible.builtin.command:
            cmd: ctr tasks ls
          register: containerd__remaining_tasks
          changed_when: false

        - name: Remove nginx task after test
          ansible.builtin.command:
            cmd: ctr tasks delete --force nginx
          when: containerd__remaining_tasks.stdout is regex('(?m)^nginx\s')
          changed_when: false

        - name: List containers after nginx test
          ansible.builtin.command:
            cmd: ctr containers ls
          register: containerd__remaining_containers
          changed_when: false

        - name: Remove nginx container and snapshot after test
          ansible.builtin.command:
            cmd: ctr containers delete nginx
          when: containerd__remaining_containers.stdout is regex('(?m)^nginx\s')
          changed_when: false
