---
# Every host runs node_exporter unless its host_vars or group_vars set this to
# false. scripts/gen-node-exporter-targets reads it from the inventory to
# build the VictoriaMetrics scrape targets, so it must be set here rather than
# left to the role's default. A host the cluster can't reach at
# <ansible_host>:<node_exporter_port> sets node_exporter_scrape_address.
node_exporter_enabled: true
# renovate: datasource=github-releases depName=prometheus/node_exporter
node_exporter_version: 1.12.1
node_exporter_host: 0.0.0.0
node_exporter_port: 9100
node_exporter_options: --collector.textfile.directory=/var/lib/node_exporter/textfile_collector --log.level=info
# Map Ansible architecture names to node_exporter release architecture names
node_exporter_arch: >-
  {{
    {
      'x86_64': 'amd64',
      'aarch64': 'arm64',
      'armv7l': 'armv7'
    }.get(ansible_facts['architecture'], ansible_facts['architecture'])
  }}
