---
# Vultr VPS running Debian 12 (bookworm)
# vc2-1c-1gb instance
common_additional_packages:
  # Flux uses Vultr networking rather than the role that installs this elsewhere.
  - resolvconf
# This remote VPS needs MagicDNS for its backup and monitoring endpoints.
tailscale_args: --advertise-exit-node --accept-dns=true
tailscale_tags: ["flux"]
ip_forwarding_enabled: true
qemu_guest_agent_enabled: false
restic_prometheus_config: {}
restic_repo: flux
restic_healthcheck_host: hc.cow-banjo.ts.net
restic_template_repository: rest:https://restic-template.cow-banjo.ts.net/v1
restic_host_config:
  default:
    # Use a dedicated repo via REST server over Tailscale. This host has limited
    # disk and memory, so pulling the index for all other machines is not practical.
    repository: "rest:https://{{ '{{' }} $repo_username {{ '}}' }}:{{ '{{' }} $repo_password {{ '}}' }}@restic.cow-banjo.ts.net/{{ ansible_facts['hostname'] }}"
netdata_parent: netdata.cow-banjo.ts.net
netdata_streaming_skip_tls_verify: true
