---
manage_network: true
interfaces_pause_time: 5
host_ipv4: "172.19.74.216"

# WiFi configuration (layereight.wifi role)
wifi_country: "US"
wifi_ssid: "bleh"
wifi_psk: "{{ vault_wifi_psk_bleh }}"

# The onboard radio's 5 GHz signal sits at the APs' minimum-RSSI join cutoff
# from the garage. A USB adapter (MT7612U) on the wall replaces it and comes up
# as wlan0 once the onboard radio is off. Without the adapter there is no
# Wi-Fi at all.
disable_onboard_wifi: true

interfaces_ether_interfaces:
  - device: wlan0
    bootproto: static
    address: "172.19.74.216"
    netmask: "255.255.255.0"
    gateway: 172.19.74.1
    dnsnameservers: 172.19.74.1
    dnssearch: oneill.net
    wpaconf: /etc/wpa_supplicant/wpa_supplicant.conf
    ip6:
      address: "{{ infrastructure_ipv6_prefix }}::74:{{ host_ipv4.split('.')[3] }}"
      prefix: "{{ infrastructure_ipv6_netmask }}"
      gateway: "{{ infrastructure_ipv6_gateway }}"
