---
- name: Restart smartd
  ansible.builtin.service:
    name: smartmontools
    state: restarted
  when:
    - common_smartd_enabled is defined
    - common_smartd_enabled | bool

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

# systemd re-reads /etc/locale.conf on reload, so services started afterwards
# get the new locale without a reboot.
- name: Reload systemd manager
  ansible.builtin.systemd:
    daemon_reload: true
