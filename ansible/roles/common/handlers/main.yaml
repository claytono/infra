---
- name: Restart smartd
  ansible.builtin.service:
    name: smartmontools
    state: restarted
  when:
    - common_smartd_enabled is defined
    - common_smartd_enabled | bool

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
