---
# Refuse to start on a node whose pods are not all Ready. Otherwise the wait
# after the upgrade cannot tell a pod the upgrade broke from one that was
# already broken, and an unrelated crash-looping pod would fail every upgrade.
# Allows a minute for pods that are just starting. A failed upgrade that left
# pods broken is caught here on the retry too, instead of being excluded.
#
# -e kubeadm_upgrade_allow_unready_pods=true upgrades anyway, and the pods that
# were not Ready are left out of the wait in upgrade-wait.yaml.

- name: "Upgrade: wait for the node's pods to be Ready before starting"
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --all-namespaces
      - --field-selector=spec.nodeName={{ inventory_hostname }},status.phase!=Succeeded,status.phase!=Failed
      - --output=jsonpath={{ kubeadm_pod_ready_jsonpath }}
  delegate_to: "{{ kubeadm_control_plane_host }}"
  environment:
    KUBECONFIG: "{{ kubeadm_kubeconfig }}"
  register: kubeadm_pods_before
  changed_when: false
  # Running out of retries is reported by the assert below, which names the pods.
  failed_when: kubeadm_pods_before.rc != 0
  until: >-
    kubeadm_pods_before.rc == 0 and (
      kubeadm_upgrade_allow_unready_pods | bool or
      kubeadm_pods_before.stdout_lines | reject('search', ' True$') | list | length == 0)
  retries: 6
  delay: 10

- name: "Upgrade: record the pods that were not Ready before the upgrade"
  ansible.builtin.set_fact:
    kubeadm_pods_unready_before: >-
      {{ kubeadm_pods_before.stdout_lines | reject('search', ' True$')
         | map('split', ' ') | map('first') | list }}

- name: "Upgrade: require the node's pods to be Ready"
  ansible.builtin.assert:
    that: kubeadm_upgrade_allow_unready_pods | bool or kubeadm_pods_unready_before | length == 0
    fail_msg: >-
      Refusing to upgrade {{ inventory_hostname }}: these pods were not Ready
      before the upgrade started: {{ kubeadm_pods_unready_before | join(', ') }}.
      Fix them, or re-run with -e kubeadm_upgrade_allow_unready_pods=true to
      upgrade anyway and leave them out of the readiness wait.
    quiet: true
