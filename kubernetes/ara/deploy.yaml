---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: ara-ara
  labels:
    app: ara

spec:
  replicas: 1
  selector:
    matchLabels:
      app: ara
  template:
    metadata:
      labels:
        app: ara
    spec:
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: ara
        image: docker.io/recordsansible/ara-api:latest@sha256:9dfd6e18f474c2437081a0397310a264aa368b8364aea772c3b5b22bdd788cf5
        imagePullPolicy: IfNotPresent
        env:
        - name: ARA_ALLOWED_HOSTS
          value: "['ara.k.oneill.net', 'ara.ara.svc.cluster.local']"
        - name: ARA_CORS_ORIGIN_WHITELIST
          value: "['https://ara.k.oneill.net']"
        - name: ARA_DATABASE_ENGINE
          value: django.db.backends.postgresql
        - name: ARA_DATABASE_HOST
          value: ara-postgres-rw
        - name: ARA_DATABASE_NAME
          value: ara
        - name: ARA_DATABASE_PORT
          value: '5432'
        - name: ARA_DATABASE_USER
          value: ara
        - name: ARA_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ara-postgres-app
              key: password
        - name: ARA_EXTERNAL_AUTH
          value: 'true'
        - name: ARA_LOG_LEVEL
          value: INFO
        - name: ARA_READ_LOGIN_REQUIRED
          value: 'false'
        - name: ARA_WRITE_LOGIN_REQUIRED
          value: 'false'
        - name: ARA_TIME_ZONE
          value: America/New_York
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: ara
          mountPath: /opt/ara
        livenessProbe:
          httpGet:
            path: /api/
            port: 8000
            httpHeaders:
            - name: Host
              value: ara.k.oneill.net
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /api/
            port: 8000
            httpHeaders:
            - name: Host
              value: ara.k.oneill.net
          initialDelaySeconds: 30
        startupProbe:
          httpGet:
            path: /api/
            port: 8000
            httpHeaders:
            - name: Host
              value: ara.k.oneill.net
          initialDelaySeconds: 30
          failureThreshold: 30
      volumes:
      - name: ara
        persistentVolumeClaim:
          claimName: ara-ara-pvc
