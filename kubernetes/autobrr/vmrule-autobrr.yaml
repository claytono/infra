---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule

metadata:
  name: autobrr

spec:
  groups:
  - name: autobrr.rules
    rules:
    - alert: AutobrrIRCUnhealthy
      expr: >
        autobrr_irc_channel_enabled_total{app_kubernetes_io_name="autobrr"}
        - autobrr_irc_channel_monitored_total{app_kubernetes_io_name="autobrr"} >
        0
      for: 10m
      annotations:
        message: Autobrr is not monitoring {{ $value }} enabled channel(s) on IRC
          network {{ $labels.network }}
    - alert: AutobrrFeedStale
      expr: >
        time() - autobrr_feed_last_run_timestamp_seconds{app_kubernetes_io_name="autobrr"}
        > 21600
      for: 10m
      annotations:
        message: Autobrr feed/indexer {{ $labels.feed }} has not completed successfully
          in more than 6 hours
