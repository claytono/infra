---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: bambuddy-postgres
  namespace: bambuddy

spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f89a40f4d74aa6e0900917eaf6299b125a6382eb02fd4ee5d46f55bcbf7e5726
  enablePDB: false

  storage:
    size: 10Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOncePod

  bootstrap:
    initdb:
      database: bambuddy
      owner: bambuddy
      secret:
        name: bambuddy-postgres-app
