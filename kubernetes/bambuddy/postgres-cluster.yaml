---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: bambuddy-postgres
  namespace: bambuddy

spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:5bf4a23aa13fb560903fba932676773ba4ba2729c162e587b09bf539a2e3df56
  enablePDB: false
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 0

  storage:
    size: 10Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOncePod

  bootstrap:
    initdb:
      database: bambuddy
      owner: bambuddy
      secret:
        name: bambuddy-postgres-app
