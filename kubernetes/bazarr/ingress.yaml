---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: bazarr
  labels:
    app: bazarr
  annotations:
    ak-type: basic-auth
    ak-path-exclude: /api(/|$)
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Bazarr
    gethomepage.dev/group: Media Automation
    gethomepage.dev/icon: bazarr.png
    gethomepage.dev/description: Subtitle Downloader

spec:
  tls:
  - hosts:
    - bazarr.k.oneill.net
  rules:
  - host: bazarr.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bazarr
            port:
              number: 6767
