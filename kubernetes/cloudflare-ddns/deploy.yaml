---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudflare-ddns
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-ddns
      app.kubernetes.io/instance: cloudflare-ddns
  template:
    metadata:
      name: cloudflare-ddns
      labels:
        app.kubernetes.io/name: cloudflare-ddns
        app.kubernetes.io/instance: cloudflare-ddns
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflare-ddns
        image: docker.io/favonia/cloudflare-ddns:1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        env:
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-ddns
              key: CLOUDFLARE_API_TOKEN
        # The pod detects its node's IPv6 address, so hostid6 keeps the
        # detected prefix and substitutes luser's host bits.
        - name: DOMAINS
          value: luser.fnord.net{hostid6=::74:161},luser.oneill.net{hostid6=::74:161}
        # IPv4 only: the router forwards Plex over IPv4 alone.
        - name: IP4_DOMAINS
          valueFrom:
            secretKeyRef:
              name: cloudflare-ddns
              key: IP4_DOMAINS
