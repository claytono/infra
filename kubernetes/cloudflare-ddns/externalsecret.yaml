---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: cloudflare-ddns

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  data:
  - secretKey: CLOUDFLARE_API_TOKEN
    remoteRef:
      key: cloudflare-ddns
      property: CLOUDFLARE_API_TOKEN
  # Plex's public hostname, kept out of this public repo.
  - secretKey: IP4_DOMAINS
    remoteRef:
      key: plex
      property: public-hostname
