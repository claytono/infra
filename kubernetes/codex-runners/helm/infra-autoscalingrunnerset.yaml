---
# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: codex-infra
  namespace: codex-runners
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    app.kubernetes.io/name: codex-infra
    app.kubernetes.io/instance: codex-infra
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: codex-infra
    actions.github.com/scale-set-namespace: codex-runners
  annotations:
    actions.github.com/values-hash: 214ca32a9141bbcc78a9ffc9b38e0f81699055bd56d33f5793f01e6db9932af
    actions.github.com/cleanup-manager-role-binding: codex-runners-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: codex-runners-gha-rs-manager
spec:
  githubConfigUrl: https://github.com/claytono/infra
  githubConfigSecret: codex-runner-github
  runnerScaleSetName: codex-infra
  runnerScaleSetLabels:
    - codex
  maxRunners: 4
  minRunners: 0
  listenerConfig:
    scaler:
      burst: 100
      qps: 50
  template:
    metadata:
      labels:
        codex-runner: "true"
        codex-runner-repo: infra
    spec:
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      dnsPolicy: None
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsUser: 1001
        supplementalGroups:
          - 27
      restartPolicy: Never
      serviceAccountName: codex-runner
      initContainers:
        - command:
            - python3
            - /etc/codex-auth-tools/copy-auth-json.py
          env:
            - name: AUTH_SOURCE
              value: /auth/auth.json
            - name: CODEX_HOME
              value: /home/runner/.codex
          image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:637619278855a77885a94312efa7decd8479ca6cec5f959e134cbab96582821e
          name: copy-codex-auth
          volumeMounts:
            - mountPath: /auth
              name: codex-auth
              readOnly: true
            - mountPath: /home/runner/.codex
              name: codex-home
            - mountPath: /etc/codex-auth-tools
              name: codex-auth-tools
              readOnly: true
      containers:
        - name: runner
          command:
            - /home/runner/run.sh
          image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
          env:
            - name: CODEX_HOME
              value: /home/runner/.codex
            - name: USER
              value: runner
            - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
              value: /etc/arc/hooks/job-started.sh
          volumeMounts:
            - mountPath: /home/runner/.codex
              name: codex-home
            - mountPath: /etc/arc/hooks
              name: runner-hooks
              readOnly: true
      volumes:
        - emptyDir: {}
          name: codex-home
        - name: codex-auth
          persistentVolumeClaim:
            claimName: codex-auth
        - configMap:
            defaultMode: 365
            name: codex-auth-tools
          name: codex-auth-tools
        - configMap:
            defaultMode: 493
            items:
              - key: job-started.sh
                path: job-started.sh
              - key: install-runner-prerequisites.sh
                path: job-started.d/10-install-runner-prerequisites.sh
            name: codex-runner-hooks
          name: runner-hooks
