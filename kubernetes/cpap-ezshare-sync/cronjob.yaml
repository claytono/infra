---
apiVersion: batch/v1
kind: CronJob

metadata:
  name: ezshare-sync

spec:
  schedule: 0 * * * *
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          priorityClassName: usb-device-priority
          nodeSelector:
            feature.node.kubernetes.io/usb-ff_148f_7601.present: 'true'
          containers:
          - name: sync
            image: debian:stable-slim@sha256:13e0a2e78aa0554ad5ff66e4e260c6dbcdff807eb1f39d43b9fb0288aae88b04
            imagePullPolicy: IfNotPresent
            command:
            - /scripts/run
            env:
            - name: EZSHARE_URL
              value: http://192.168.4.1
            - name: SYNC_TARGET
              value: /mirror/card
            - name: HEALTHCHECK_PING_KEY
              valueFrom:
                secretKeyRef:
                  name: healthchecks
                  key: HEALTHCHECK_PING_KEY
            volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /mirror
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: script
            configMap:
              name: run-script
              defaultMode: 0755
          - name: data
            persistentVolumeClaim:
              claimName: data
          - name: tmp
            emptyDir: {}
          restartPolicy: Never
