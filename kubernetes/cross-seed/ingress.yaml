---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: cross-seed
  labels:
    app: cross-seed

spec:
  tls:
  - hosts:
    - cross-seed.k.oneill.net
  rules:
  - host: cross-seed.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cross-seed
            port:
              number: 2468
