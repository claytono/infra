---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: dawarich-postgres

spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:17.7-3.6.1-standard-trixie@sha256:d7ef4f25f5833a1056673f964c2ddf6d6b38e72dc62f75623238c50dc2075fe6
  enablePDB: false
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 0

  storage:
    size: 20Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOncePod

  managed:
    roles:
    - name: dawarich
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      inherit: true
      replication: false
      bypassrls: false
      connectionLimit: -1
      # Grant permission to create extensions
      inRoles:
      - pg_create_extension

  bootstrap:
    initdb:
      database: dawarich
      owner: dawarich
      postInitTemplateSQL:
      - CREATE EXTENSION IF NOT EXISTS postgis
