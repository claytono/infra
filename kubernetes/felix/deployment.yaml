---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: felix
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: felix
      app.kubernetes.io/instance: felix
  template:
    metadata:
      name: felix
      labels:
        app.kubernetes.io/name: felix
        app.kubernetes.io/instance: felix
    spec:
      serviceAccountName: felix
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      initContainers:
      # Work around the image's startup hook calling s6-setuidgid when already
      # non-root by running its config migration directly before Hermes.
      - name: hermes-config-migrate
        image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        command:
        - /opt/hermes/.venv/bin/python
        - /opt/hermes/scripts/docker_config_migrate.py
        env:
        - name: HERMES_HOME
          value: /opt/data
        volumeMounts:
        - name: data
          mountPath: /opt/data
      - name: www
        image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:93722936b82ec8a1178d48448e619226680d2de3706a1640800e186cd5fa7fd3
        restartPolicy: Always
        ports:
        - containerPort: 8080
          name: www
          protocol: TCP
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: workspace
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: nginx-tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
      - name: api
        image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
        restartPolicy: Always
        command:
        - /bin/sh
        - /etc/api/api-entrypoint.sh
        ports:
        - containerPort: 3001
          name: api
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: felix-db-app
              key: uri
        - name: PORT
          value: '3001'
        - name: BUN_INSTALL_CACHE_DIR
          value: /tmp
        - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
          value: /tmp/bun-cache
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /opt/workspace
          subPath: workspace
          readOnly: false
        - name: api-tmp
          mountPath: /tmp
        - name: api-entrypoint
          mountPath: /etc/api
          readOnly: true
      containers:
      - name: hermes
        image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
        args:
        - gateway
        - run
        ports:
        - name: gateway
          containerPort: 8642
        - name: webhook
          containerPort: 8644
        - name: dashboard
          containerPort: 9119
        env:
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: HERMES_DASHBOARD
          value: '1'
        - name: HERMES_DASHBOARD_OIDC_ISSUER
          value: https://auth.k.oneill.net/application/o/felix-dashboard/
        - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
          value: felix-dashboard
        - name: HERMES_DASHBOARD_PUBLIC_URL
          value: https://felix-dashboard.k.oneill.net
        - name: CAMOFOX_URL
          value: http://camofox.camofox.svc.cluster.local:9377
        envFrom:
        - secretRef:
            name: felix-secrets
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  fieldPath: metadata.namespace
                path: namespace
      - name: data
        persistentVolumeClaim:
          claimName: felix-data
      - name: nginx-config
        configMap:
          name: felix-nginx-config
      - name: api-entrypoint
        configMap:
          name: felix-api-entrypoint
          defaultMode: 0755
      - name: nginx-tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: nginx-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: api-tmp
        emptyDir:
          sizeLimit: 10Gi
