---
image:
  tag: v4.14.7  # Override chart default (v4.14.1) to get InPlaceOrRecreate fix

controller:
  rbac:
    enableArgoproj: false
    # Goldilocks finds a pod's workload by following its owner references.
    # CNPG instance pods are owned directly by a Cluster; without read access
    # the lookup fails, Goldilocks silently skips the pod, and Postgres runs
    # with no requests.
    extraRules:
    - apiGroups: [postgresql.cnpg.io]
      resources: [clusters]
      verbs: [get, list, watch]
    # VMAgent has a scale subresource, so VPA only accepts a VPA aimed at
    # it, not at its Deployment. Only vmagents: the other operator kinds
    # aren't scalable, so their Deployments are the right VPA targets.
    - apiGroups: [operator.victoriametrics.com]
      resources: [vmagents]
      verbs: [get, list, watch]
  resources:
    limits:
      memory: 256Mi
  flags:
    on-by-default: false  # Only create VPAs for namespaces with goldilocks label

dashboard:
  replicaCount: 1
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
  ingress:
    enabled: true
    annotations:
      ak-type: simple
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/name: Goldilocks
      gethomepage.dev/description: VPA generation and web UI
      gethomepage.dev/icon: goldilocks.png
      gethomepage.dev/group: Monitoring
      gethomepage.dev/pod-selector: app.kubernetes.io/name=goldilocks

    hosts:
    - host: goldilocks.k.oneill.net
      paths:
      - path: /
        type: Prefix
    tls:
    - hosts: [goldilocks.k.oneill.net]
