---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: grimmory
  namespace: grimmory

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grimmory
  template:
    metadata:
      labels:
        app: grimmory
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: grimmory
        image: grimmory/grimmory:v3.3.3@sha256:fffd0ae0bfccd64ca00441e8fa58a14e286b9115e5df1cb47eecf294ad09e6ff
        ports:
        - containerPort: 6060
          name: http
        env:
        - name: DATABASE_URL
          value: jdbc:mariadb://grimmory-mariadb.grimmory.svc.cluster.local:3306/grimmory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
        - name: DATABASE_USERNAME
          value: grimmory
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grimmory-mariadb-secrets
              key: user-password
        # Allow the trusted in-cluster Authentik issuer through Grimmory's OIDC filter.
        - name: OIDC_ALLOW_UNSAFE_HOSTS
          value: 'true'
        - name: TZ
          value: EST5EDT
        - name: USER_ID
          value: '10001'
        - name: GROUP_ID
          value: '10001'
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: books
          mountPath: /books
        - name: bookdrop
          mountPath: /bookdrop
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grimmory-data
      - name: books
        nfs:
          server: fs2.oneill.net
          path: /volume2/shared/books/grimmory
      - name: bookdrop
        nfs:
          server: fs2.oneill.net
          path: /volume2/shared/downloads/grimmory-ingestion
