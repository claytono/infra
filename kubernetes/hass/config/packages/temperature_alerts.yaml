---
# Temperature monitoring using 20-minute rolling minimum
# Alerts only fire if minimum temp over 20 minutes exceeds threshold
# This filters out brief door-open spikes
#
# The refrigerator has two alerts instead. Warm leftovers raise it to
# about 41.5F for two to three hours, which a 20-minute window over 40F
# reported several times a week. A door left open climbs past 45F within
# minutes, so that alert uses a 15-minute window and calls at any hour.
# A fridge that runs warm stays above 40F for good, so the other alert
# waits four hours and calls only between 8 AM and 10 PM; a fridge
# still warm in the morning calls at 8 AM.

sensor:
- platform: statistics
  name: Garage Freezer Temperature Min 20m
  entity_id: sensor.garage_freezer_temperature
  state_characteristic: value_min
  max_age:
    minutes: 20

- platform: statistics
  name: Refrigerator Temperature Min 15m
  entity_id: sensor.refrigerator_temperature
  state_characteristic: value_min
  max_age:
    minutes: 15

- platform: statistics
  name: Refrigerator Temperature Min 4h
  entity_id: sensor.refrigerator_temperature
  state_characteristic: value_min
  max_age:
    hours: 4

- platform: statistics
  name: Refrigerator Freezer Temperature Min 20m
  entity_id: sensor.refrigerator_freezer_temperature
  state_characteristic: value_min
  max_age:
    minutes: 20

- platform: statistics
  name: Refrigerator Lower Drawer Temperature Min 20m
  entity_id: sensor.refrigerator_lower_drawer_temperature
  state_characteristic: value_min
  max_age:
    minutes: 20

template:

- binary_sensor:
  - name: Garage Freezer Too Warm
    unique_id: garage_freezer_too_warm
    device_class: problem
    state: >
      {% set temp = states("sensor.garage_freezer_temperature_min_20m") %}
      {{ temp not in ['unknown', 'unavailable'] and temp | float > 10 }}

  - name: Refrigerator Door Open
    unique_id: refrigerator_door_open
    device_class: problem
    state: >
      {% set temp = states("sensor.refrigerator_temperature_min_15m") %}
      {{ temp not in ['unknown', 'unavailable'] and temp | float > 45 }}

  - name: Refrigerator Running Warm
    unique_id: refrigerator_running_warm
    device_class: problem
    state: >
      {% set temp = states("sensor.refrigerator_temperature_min_4h") %}
      {{ temp not in ['unknown', 'unavailable'] and temp | float > 40
         and 8 <= now().hour < 22 }}

  - name: Refrigerator Freezer Too Warm
    unique_id: refrigerator_freezer_too_warm
    device_class: problem
    state: >
      {% set temp = states("sensor.refrigerator_freezer_temperature_min_20m") %}
      {{ temp not in ['unknown', 'unavailable'] and temp | float > 15 }}

  - name: Refrigerator Lower Drawer Too Warm
    unique_id: refrigerator_lower_drawer_too_warm
    device_class: problem
    state: >
      {% set temp = states("sensor.refrigerator_lower_drawer_temperature_min_20m")
      %}
      {{ temp not in ['unknown', 'unavailable'] and temp | float > 40 }}

alert:
  garage_freezer_too_warm:
    name: Temperature in the garage freezer is too warm!
    entity_id: binary_sensor.garage_freezer_too_warm
    state: 'on'
    repeat: 10
    notifiers:
    - call_me

  refrigerator_door_open:
    name: The refrigerator is above 45 degrees! Is the door open?
    entity_id: binary_sensor.refrigerator_door_open
    state: 'on'
    repeat: 10
    notifiers:
    - call_me

  refrigerator_running_warm:
    name: The refrigerator has been above 40 degrees for four hours!
    entity_id: binary_sensor.refrigerator_running_warm
    state: 'on'
    repeat: 10
    notifiers:
    - call_me

  refrigerator_freezer_too_warm:
    name: Temperature in the refrigerator freezer is too warm!
    entity_id: binary_sensor.refrigerator_freezer_too_warm
    state: 'on'
    repeat: 10
    notifiers:
    - call_me

  refrigerator_lower_drawer_too_warm:
    name: Temperature in the refrigerator lower drawer is too warm!
    entity_id: binary_sensor.refrigerator_lower_drawer_too_warm
    state: 'on'
    repeat: 10
    notifiers:
    - call_me

automation:
- id: refresh_appliance_temperatures
  alias: Refresh appliance temperatures
  description: Keep the appliance rolling minima supplied with YoLink reports.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: "/5"
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id:
      - sensor.garage_freezer_temperature
      - sensor.refrigerator_temperature
      - sensor.refrigerator_freezer_temperature
      - sensor.refrigerator_lower_drawer_temperature
