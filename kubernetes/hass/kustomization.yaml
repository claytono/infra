---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hass

commonAnnotations:
  argoManaged: 'true'

resources:
- namespace.yaml
- hass-externalsecrets.yaml
- hass-postgres-cluster.yaml
- config
- helm/ingress.yaml
- helm/service.yaml
- helm/serviceaccount.yaml
- helm/statefulset.yaml

images:
- name: ghcr.io/home-assistant/home-assistant
  newName: homeassistant/home-assistant
  newTag: 2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133

labels:

- pairs:
    app.kubernetes.io/name: hass
    app.kubernetes.io/instance: hass
  includeSelectors: true
