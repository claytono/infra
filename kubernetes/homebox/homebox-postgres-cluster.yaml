---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: homebox-postgres

spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065
  enablePDB: false
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 0

  storage:
    size: 10Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOncePod

  bootstrap:
    initdb:
      database: homebox
      owner: homebox
