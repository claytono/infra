---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:

- homebox-postgres-cluster.yaml
- externalsecret-oidc.yaml
- externalsecret-api-key-pepper.yaml

  # HomeBox resources
- helm/homebox/deployment.yaml
- helm/homebox/secrets.yaml
- helm/homebox/service.yaml
- helm/homebox/pvc.yaml
- helm/homebox/serviceaccount.yaml
- helm/homebox/ingress.yaml

commonAnnotations:
  argoManaged: 'true'

images:
- name: sysadminsmedia/homebox
  newTag: 0.27.0@sha256:d49f12caf25ce3fa7f44102bb74953f3dff2dfdad38d87bd9057f3f611e797bb

patches:

- target:
    kind: Deployment
    name: homebox
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: homebox
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
          - name: homebox
            env:
            - name: HBOX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homebox-postgres-app
                  key: password
            - name: HBOX_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: homebox-oidc
                  key: HBOX_OIDC_CLIENT_ID
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homebox-oidc
                  key: HBOX_OIDC_CLIENT_SECRET
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox-api-key-pepper
                  key: HBOX_AUTH_API_KEY_PEPPER

# Add labels for metrics
labels:

- pairs:
    app.kubernetes.io/name: homebox
    app.kubernetes.io/instance: homebox
