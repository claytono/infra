---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: homepage
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/instance: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/instance: homepage
    spec:
      serviceAccountName: homepage
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:v2.6.0@sha256:3e38fe788223cb46a3ce1f046ef11667b40f7707fdca0dcbfa3f86c5c42bf1e8
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: homepage.k.oneill.net
        - name: HOMEPAGE_AUTH_ENABLED
          value: 'true'
        - name: HOMEPAGE_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: homepage-auth
              key: HOMEPAGE_AUTH_SECRET
        - name: HOMEPAGE_EXTERNAL_URL
          value: https://homepage.k.oneill.net
        - name: HOMEPAGE_OIDC_ISSUER
          value: https://auth.k.oneill.net/application/o/homepage/
        - name: HOMEPAGE_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: homepage-oidc
              key: HOMEPAGE_OIDC_CLIENT_ID
        - name: HOMEPAGE_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: homepage-oidc
              key: HOMEPAGE_OIDC_CLIENT_SECRET
        - name: HOMEPAGE_OIDC_NAME
          value: Authentik
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: homepage-base-config
          mountPath: /app/config
        - name: homepage-config
          subPath: bookmarks.yaml
          mountPath: /app/config/bookmarks.yaml
        - name: homepage-config
          subPath: custom.js
          mountPath: /app/config/custom.js
        - name: homepage-config
          subPath: docker.yaml
          mountPath: /app/config/docker.yaml
        - name: homepage-config
          subPath: kubernetes.yaml
          mountPath: /app/config/kubernetes.yaml
        - name: homepage-config
          subPath: services.yaml
          mountPath: /app/config/services.yaml
        - name: homepage-config
          subPath: settings.yaml
          mountPath: /app/config/settings.yaml
        - name: homepage-config
          subPath: widgets.yaml
          mountPath: /app/config/widgets.yaml
        - name: logs
          mountPath: /app/config/logs
        livenessProbe:
          tcpSocket:
            port: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
        startupProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: homepage-base-config
        emptyDir: {}
      - name: homepage-config
        configMap:
          name: homepage
      - name: logs
        emptyDir: {}
