---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: homepage
  annotations:
    ak-oidc-callback: /api/auth/callback/homepage-oidc
    ak-type: oidc
    cert-manager.io/cluster-issuer: letsencrypt

spec:
  tls:
  - hosts:
    - homepage.k.oneill.net
    secretName: homepage-tls
  rules:
  - host: homepage.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 3000
