---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

commonAnnotations:
  argoManaged: 'true'

resources:
- serviceaccount.yaml
- serviceaccount-token.yaml
- clusterrole.yaml
- clusterrolebinding.yaml
- deploy.yaml
- service.yaml
- ingress.yaml
- externalsecret-auth.yaml
- externalsecret-oidc.yaml
- password-generator.yaml

labels:

- pairs:
    app: homepage

configMapGenerator:
- name: homepage
  options:
    disableNameSuffixHash: true
  literals:
  - docker.yaml=""
  - bookmarks.yaml=""
  files:
  - custom.js
  - kubernetes.yaml
  - settings.yaml
  - widgets.yaml
  - services.yaml
