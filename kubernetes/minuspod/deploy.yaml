---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: minuspod
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minuspod
      app.kubernetes.io/instance: minuspod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minuspod
        app.kubernetes.io/instance: minuspod
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: minuspod
        image: ttlequals0/minuspod:stable@sha256:c52f2598ea671f770ed7363561bb0897579ffb6cb71415d26ff5243cc9c9fb0a
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: BASE_URL
          value: https://minuspod-feed.oneill.net
        - name: UI_BASE_URL
          value: https://minuspod.k.oneill.net
        - name: LLM_PROVIDER
          value: openrouter
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: minuspod-openrouter-env
              key: OPENROUTER_API_KEY
        - name: WHISPER_BACKEND
          value: parakeet
        - name: WHISPER_LANGUAGE
          value: en
        # Make glibc return freed memory to the OS. Without these, the
        # Parakeet backend grew about 0.65 GiB per episode and never shrank;
        # with them it stays near 2 GiB while transcribing and drops below
        # 1 GiB when the model unloads, with no measurable CPU cost.
        # Two malloc arenas instead of up to eight per core, so freed memory
        # doesn't sit stranded across many per-thread heaps.
        - name: MALLOC_ARENA_MAX
          value: '2'
        # Serve allocations of 128 KiB or more with mmap, so freeing them
        # unmaps them immediately. Setting it also stops glibc from raising
        # the threshold on its own (up to 32 MiB), which is what let large
        # buffers stay in the heap after use.
        - name: MALLOC_MMAP_THRESHOLD_
          value: '131072'
        # Release free memory at the top of the heap once it passes 128 KiB.
        # Setting it keeps glibc from raising this threshold as well.
        - name: MALLOC_TRIM_THRESHOLD_
          value: '131072'
        - name: TRANSCRIBE_CONCURRENT_CHUNKS
          value: '1'
        - name: MINUSPOD_TRUSTED_PROXY_COUNT
          value: '1'
        - name: SESSION_COOKIE_SECURE
          value: 'true'
        - name: MINUSPOD_ENABLE_HSTS
          value: 'true'
        envFrom:
        - secretRef:
            name: minuspod-env
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minuspod-data
