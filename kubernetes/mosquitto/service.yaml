---
apiVersion: v1
kind: Service

metadata:
  labels:
    name: mosquitto
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mqtt.k.oneill.net
    external-dns.kubernetes.io/hostname: mqtt.k.oneill.net
    metallb.io/allow-shared-ip: plexmediaserver
    metallb.io/address-pool: shared
  name: mosquitto

spec:
  type: LoadBalancer
  ipFamilyPolicy: RequireDualStack
  selector:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/instance: mosquitto
  ports:
  - name: mqtt
    protocol: TCP
    port: 1883
  - name: mqtt-websockets
    protocol: TCP
    port: 9001
  - name: mqtt-tls
    protocol: TCP
    port: 8883
  - name: mqtt-websockets-tls
    protocol: TCP
    port: 8084
