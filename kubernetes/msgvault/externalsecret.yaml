---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: msgvault-secrets
  namespace: msgvault

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  refreshPolicy: CreatedOnce
  target:
    name: msgvault-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
  - rewrite:
    - regexp:
        source: password
        target: api-key
    sourceRef:
      generatorRef:
        kind: Password
        name: msgvault-api-key

---
# The Fastmail login. The init container puts the user into config.toml, and
# the password is only read by `msgvault add-imap` when rebuilding the
# archive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: msgvault-imap
  namespace: msgvault

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: msgvault-imap
  data:
  - secretKey: IMAP_USER
    remoteRef:
      key: msgvault
      property: imap-username
  - secretKey: MSGVAULT_IMAP_PASSWORD
    remoteRef:
      key: msgvault
      property: imap-password
