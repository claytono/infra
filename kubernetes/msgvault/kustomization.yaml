---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: msgvault

components:
- ../components/authentik

resources:
- namespace.yaml
- password-generators.yaml
- externalsecret.yaml
- pvc.yaml
- service.yaml
- deploy.yaml
- ingress.yaml

configMapGenerator:
- name: msgvault-config
  files:
  - config.toml

commonAnnotations:
  argoManaged: 'true'
