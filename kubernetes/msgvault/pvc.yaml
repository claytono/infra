---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: msgvault-data
  namespace: msgvault
  labels:
    # The archive is rebuildable from Fastmail.
    velero.io/backup: 'false'

spec:
  accessModes:
  - ReadWriteOnce
  # SQLite must not live on NFS.
  storageClassName: synology-iscsi
  resources:
    requests:
      storage: 60Gi
