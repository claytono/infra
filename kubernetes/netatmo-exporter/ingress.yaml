---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: netatmo-exporter

spec:
  tls:
  - hosts:
    - netatmo-exporter.k.oneill.net
  rules:
  - host: netatmo-exporter.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: netatmo-exporter
            port:
              number: 9210
