---
# Source: netdata/templates/parent/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: netdata-conf-parent
  namespace: netdata
  labels:
    app: netdata
    chart: netdata-3.7.177
    release: netdata
    heritage: Helm
data:
    
  go.d: |
        default_run: false
        modules:
          prometheus: true
  go.d-prometheus: |
        jobs:
          - name: proxmox-cluster
            url: http://prometheus-pve-exporter.o11y.svc:9221/pve?target=p1.oneill.net&cluster=1&node=0
          - name: proxmox-p1
            url: http://prometheus-pve-exporter.o11y.svc:9221/pve?target=p1.oneill.net&cluster=0&node=1
  health: |
        SEND_EMAIL="NO"
        SEND_SLACK="YES"
        SLACK_WEBHOOK_URL=""
        DEFAULT_RECIPIENT_SLACK=""
  health-cpu: |
        template: 1hour_cpu_usage
        on: system.cpu
        class: Utilization
        type: System
        component: CPU
        host labels: _os=linux
        lookup: average -1h unaligned of user,system,softirq,irq,guest
        units: %
        every: 1m
        warn: $this > (($status >= $WARNING)  ? (75) : (85))
        crit: $this > (($status == $CRITICAL) ? (85) : (95))
        delay: down 15m multiplier 1.5 max 1h
        summary: System CPU utilization
        info: Average CPU utilization over the last hour (excluding iowait, nice and steal)
        to: sysadmin
      
        template: 10min_cpu_iowait
        on: system.cpu
        class: Utilization
        type: System
        component: CPU
        host labels: _os=linux
        lookup: average -10m unaligned of iowait
        units: %
        every: 1m
        warn: $this > (($status >= $WARNING)  ? (20) : (40))
        delay: up 30m down 30m multiplier 1.5 max 2h
        summary: System CPU iowait time
        info: Average CPU iowait time over the last 10 minutes
        to: silent
      
        template: 20min_steal_cpu
        on: system.cpu
        class: Latency
        type: System
        component: CPU
        host labels: _os=linux
        lookup: average -20m unaligned of steal
        units: %
        every: 5m
        warn: $this > (($status >= $WARNING)  ? (5)  : (10))
        delay: down 1h multiplier 1.5 max 2h
        summary: System CPU steal time
        info: Average CPU steal time over the last 20 minutes
        to: silent
  netdata: |
        [global]
          hostname = netdata-parent
        [db]
          mode = dbengine
      
        [plugins]
          cgroups = no
          tc = no
          enable running new plugins = no
          check for new plugins every = 72000
          python.d = no
          charts.d = no
          go.d = no
          node.d = no
          apps = no
          proc = no
          idlejitter = no
          diskspace = no
  stream: |
        [11111111-2222-3333-4444-555555555555]
          enabled = yes
          history = 3600
          default memory mode = dbengine
          health enabled by default = auto
          allow from = *

