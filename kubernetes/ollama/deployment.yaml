---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      runtimeClassName: nvidia
      priorityClassName: gpu-priority
      containers:
      - name: ollama
        image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
        env:
        - name: OLLAMA_CONTEXT_LENGTH
          value: '8192'
        ports:
        - name: http
          containerPort: 11434
          protocol: TCP
        lifecycle:
          postStart:
            exec:
              command:
              - /etc/ollama/scripts/apply-modelfiles.sh
        readinessProbe:
          # Ready once the model karakeep and memex use is built, not just
          # once the server answers.
          exec:
            command:
            - ollama
            - show
            - snowflake-arctic-embed2:mine
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        - name: modelfiles
          mountPath: /etc/ollama/models
          readOnly: true
        - name: scripts
          mountPath: /etc/ollama/scripts
          readOnly: true
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
      - name: modelfiles
        configMap:
          name: ollama-modelfiles
      - name: scripts
        configMap:
          name: ollama-scripts
          defaultMode: 0555
