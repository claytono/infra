---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ollama

resources:
- namespace.yaml
- deployment.yaml
- pvc.yaml
- service.yaml
- tailscale-ingress.yaml

configMapGenerator:
- name: ollama-modelfiles
  files:
  - snowflake-arctic-embed2.Modelfile
  options:
    disableNameSuffixHash: true
- name: ollama-scripts
  files:
  - scripts/apply-modelfiles.sh
  options:
    disableNameSuffixHash: true

commonAnnotations:
  argoManaged: 'true'
