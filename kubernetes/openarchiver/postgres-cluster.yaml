---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: openarchiver-postgres
  namespace: openarchiver

spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  enablePDB: false
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 0

  storage:
    size: 20Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOncePod

  bootstrap:
    initdb:
      database: openarchiver
      owner: openarchiver
