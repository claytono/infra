---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: openarchiver-postgres
  namespace: openarchiver

spec:
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'

  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  enablePDB: false
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 0

  storage:
    size: 20Gi
    pvcTemplate:
      accessModes:
      - ReadWriteOncePod

  bootstrap:
    initdb:
      database: openarchiver
      owner: openarchiver
