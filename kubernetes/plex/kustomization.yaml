---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plex

commonAnnotations:
  argoManaged: 'true'

resources:
- namespace.yaml
- deploy.yaml
- ingress.yaml
- service.yaml
- externalsecret.yaml
- pvc-config.yaml

labels:

- pairs:
    app.kubernetes.io/name: plex
    app.kubernetes.io/instance: plex
  includeSelectors: true
