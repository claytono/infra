---
# Traefik's routing config, built here so the public hostname stays in
# 1Password and out of this public repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: plex-traefik

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: plex-traefik-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        dynamic.yaml: |
          tls:
            options:
              default:
                sniStrict: true
                minVersion: VersionTLS12
            certificates:
            - certFile: /etc/traefik/certs/tls.crt
              keyFile: /etc/traefik/certs/tls.key
          http:
            routers:
              plex:
                rule: Host(`{{ .hostname }}`)
                entryPoints: [websecure]
                service: plex
                tls: {}
            services:
              plex:
                loadBalancer:
                  servers:
                  - url: http://plex:32400
  data:
  - secretKey: hostname
    remoteRef:
      key: plex
      property: public-hostname
