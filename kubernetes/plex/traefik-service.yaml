---
apiVersion: v1
kind: Service

metadata:
  name: plex-traefik
  annotations:
    metallb.io/address-pool: plex-public

spec:
  type: LoadBalancer
  # Keeps the client's address, which Traefik passes to Plex in
  # X-Forwarded-For.
  externalTrafficPolicy: Local
  ports:
  - name: websecure
    port: 18644
    targetPort: websecure
    protocol: TCP
  selector:
    app.kubernetes.io/name: plex-traefik
    app.kubernetes.io/instance: plex-traefik
