---
groups:
- name: recording.rules
  rules:
      # Records whether or not distance from bottom of desk to floor is greater
      # than one meter.
  - record: desk_up
    expr: hass_sensor_unit_m{entity="sensor.desk_ultrasonic_sensor"} >  bool 0.9
- name: alert.rules
  rules:
  - alert: Watchdog
    expr: vector(1)
    annotations:
      message: Always firing; Alertmanager forwards it to Healthchecks as a heartbeat
  - alert: NodeDown
    expr: up{job="node resources", instance!="xtal:9100"} == 0
    for: 5m
  - alert: XtalNodeExporterDown
    expr: >
      (up{job="node resources", instance="xtal:9100"} == 0)
      and on()
      (
        histogram_count(
          increase(smokeping_response_duration_seconds{host="xtal.oneill.net"}[5m])
        ) > 0
      )
    for: 35m
    annotations:
      message: xtal is reachable by LAN ICMP, but node_exporter over Tailscale has
        not been scraped for 35 minutes
  - alert: ICMPUnreachable
    expr: probe_success{job="blackbox"} == 0
    for: 20m
  - alert: QBittorrentAPIUnreachable
    expr: probe_success{job=~"qbittorrent-api-(pod|ingress)"} == 0
    for: 5m
  - alert: ExporterDown
    expr: up{job!="node resources", job!="hwinfo gaming pc", resticprofile!~".+"}
      == 0
    for: 1h
  - alert: AutobrrIRCUnhealthy
    expr: >
      autobrr_irc_enabled_total{app_kubernetes_io_name="autobrr"}
      - autobrr_irc_healthy_total{app_kubernetes_io_name="autobrr"} > 0
    for: 10m
    annotations:
      message: Autobrr has {{ $value }} enabled IRC network(s) unhealthy
  - alert: AutobrrFeedStale
    expr: >
      time() - autobrr_feed_last_run_timestamp_seconds{app_kubernetes_io_name="autobrr"}
      > 21600
    for: 10m
    annotations:
      message: Autobrr feed/indexer {{ $labels.feed }} has not completed successfully
        in more than 6 hours
  - alert: Outdoor_Sensor_Battery_Low
    expr: >
      (hass_sensor_voltage_v{entity=~"sensor.*(soil|rain).*battery.*"} <= 1.2)
      or
      ((hass_sensor_voltage_mv{entity=~"sensor.*(soil|rain).*battery.*"} / 1000)
      <= 1.2)
    for: 1h
    annotations:
      message: '{{ $labels.friendly_name }} is at {{ $value }}V - replace battery'
  - alert: Outdoor_Sensor_Unavailable
    expr: hass_entity_available{entity=~"sensor.*(soil.*moisture|rain_meter).*"} ==
      0
    for: 1d
    annotations:
      message: '{{ $labels.friendly_name }} has stopped reporting'
  - alert: PodStuckNotRunning
    expr: >
      (kube_pod_status_phase{phase!="Running", phase!="Succeeded"} == 1)
      unless on(namespace,pod) kube_pod_owner{owner_kind="Job"}
    for: 15m
    annotations:
      message: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }}
        phase for more than 15 minutes
  - alert: AptUpgradesPending
    expr: sum by (instance) (apt_upgrades_pending{origin=~".*Debian:.*"}) > 0
    for: 10d
    annotations:
      message: '{{ $labels.instance }} has had {{ $value }} Debian upgrade(s) pending
        for more than 10 days'
  - alert: AptPackageListsStale
    expr: time() - apt_package_cache_timestamp_seconds > 3 * 86400
    for: 1d
    annotations:
      message: '{{ $labels.instance }} has not refreshed its apt package lists in
        more than 3 days'
  - alert: NodeRebootRequired
    expr: node_reboot_required == 1
    for: 10d
    annotations:
      message: '{{ $labels.instance }} has needed a reboot for more than 10 days'
