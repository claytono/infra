---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  annotations:
    # Prometheus reloads its config and rules itself (--config.auto-reload);
    # restart only for the scrape credentials secret.
    secret.reloader.stakater.com/reload: prometheus

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: prometheus
  template:
    metadata:
      name: prometheus
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: prometheus
    spec:
      priorityClassName: monitoring
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --config.auto-reload
        - --web.external-url=https://prometheus.k.oneill.net
        - --storage.tsdb.retention.time=730d
        ports:
        - name: web
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: data
          mountPath: /prometheus/data
      volumes:
      - name: config
        configMap:
          name: prometheus
      - name: secrets
        secret:
          secretName: prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
