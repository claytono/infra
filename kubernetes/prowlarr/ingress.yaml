---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: prowlarr
  annotations:
    ak-type: basic-auth
    ak-path-exclude: |-
      /\d+/api.*
      /api.*
      /\d+/download.*
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/description: Indexer Manager
    gethomepage.dev/group: Media Automation
    gethomepage.dev/icon: prowlarr.png

spec:
  tls:
  - hosts:
    - prowlarr.k.oneill.net
  rules:
  - host: prowlarr.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prowlarr
            port:
              number: 9696
