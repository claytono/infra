---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: pulshealth-api-token

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    name: pulshealth-api-token
  data:
  - secretKey: PULS_API_TOKEN
    remoteRef:
      key: pulshealth-api
      property: password
