---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: pulshealth-db-roles

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  # Password generators make a new value on every refresh; generate these once.
  refreshPolicy: CreatedOnce
  target:
    name: pulshealth-db-roles
    creationPolicy: Owner
  # Password generators emit a field named `password`; rewrite each to the
  # variable name upstream's migrator reads.
  dataFrom:
  # Upstream's read-only role is named `grafana` (its bundled Grafana used it);
  # the web viewer and the api/web wait containers connect as it.
  - rewrite:
    - regexp:
        source: password
        target: GRAFANA_DB_PASSWORD
    sourceRef:
      generatorRef:
        kind: Password
        name: pulshealth-viewer-db
  - rewrite:
    - regexp:
        source: password
        target: API_DB_PASSWORD
    sourceRef:
      generatorRef:
        kind: Password
        name: pulshealth-api-db
  - rewrite:
    - regexp:
        source: password
        target: INGEST_DB_PASSWORD
    sourceRef:
      generatorRef:
        kind: Password
        name: pulshealth-ingest-db
