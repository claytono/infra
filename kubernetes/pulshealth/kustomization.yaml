---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulshealth

components:
- ../components/authentik

resources:
- namespace.yaml
# Upstream's migrate.sh and migrations as ConfigMaps, generated by ./render.
- upstream/
- imagecatalog.yaml
- postgres-cluster.yaml
- password-generator-viewer-db.yaml
- password-generator-api-db.yaml
- password-generator-ingest-db.yaml
- externalsecret-db-roles.yaml
- externalsecret-api-token.yaml
- deploy.yaml
- service-ingest.yaml
- tailscale-ingress-ingest.yaml
- service-api.yaml
- tailscale-ingress-api.yaml
- service-web.yaml
- ingress-web.yaml

commonAnnotations:
  argoManaged: 'true'
