---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: pulshealth-api-tailscale
  annotations:
    tailscale.com/tags: tag:pulshealth

spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: pulshealth-api
      port:
        number: 8081
  tls:
  - hosts:
    - pulshealth-api
