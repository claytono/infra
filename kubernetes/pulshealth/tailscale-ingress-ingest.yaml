kind: Ingress

metadata:
  name: pulshealth-ingest-tailscale
  annotations:
    tailscale.com/tags: tag:pulshealth

spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: pulshealth-ingest
      port:
        number: 8080
  tls:
  - hosts:
    - pulshealth-ingest
