---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: pushgateway

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
      app.kubernetes.io/instance: pushgateway
  template:
    metadata:
      name: pushgateway
      labels:
        app.kubernetes.io/name: pushgateway
        app.kubernetes.io/instance: pushgateway
    spec:
      containers:
      - name: pushgateway
        image: prom/pushgateway:v1.11.4@sha256:91a56b89b97dd8a5e1e4fa8b5bbbd86dd57a87a2a3cee3a3ce3368b40ef158ef
        ports:
        - name: web
          containerPort: 9091
