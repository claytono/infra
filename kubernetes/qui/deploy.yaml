---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: qui
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: qui
      app.kubernetes.io/name: qui
      app.kubernetes.io/instance: qui
  template:
    metadata:
      labels:
        app: qui
        app.kubernetes.io/name: qui
        app.kubernetes.io/instance: qui
    spec:
      containers:
      - name: qui
        image: ghcr.io/autobrr/qui:v1.25.0@sha256:3285c52f0258645d1d5a1684e25596c7355ef525363f0f9464d1c7b2cad14be8
        ports:
        - containerPort: 7476
        - containerPort: 9074
          name: metrics
        envFrom:
        - secretRef:
            name: qui-oidc
        env:
        - name: TZ
          value: America/New_York
        - name: QUI__OIDC_ENABLED
          value: 'true'
        - name: QUI__OIDC_DISABLE_BUILT_IN_LOGIN
          value: 'true'
        - name: QUI__OIDC_ISSUER
          value: https://auth.k.oneill.net/application/o/qui/
        - name: QUI__OIDC_REDIRECT_URL
          value: https://qui.k.oneill.net/api/auth/oidc/callback
        - name: QUI__METRICS_ENABLED
          value: 'true'
        - name: QUI__METRICS_HOST
          value: 0.0.0.0
        - name: QUI__METRICS_PORT
          value: '9074'
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /downloads
          name: downloads
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qui-config
      - name: downloads
        nfs:
          server: fs2.oneill.net
          path: /volume2/shared/downloads
