---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: restic

resources:
- cronjobs
- rest-server
- shared
- template-server

commonAnnotations:
  argoManaged: 'true'

configMapGenerator:

- files:
  - profiles.yaml
  - body-start.txt
  - body-success.txt
  - body-failure.txt
  name: resticprofile-config
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/instance: restic
      app.kubernetes.io/name: resticprofile
      app.kubernetes.io/component: resticprofile

- files:
  - rclone.conf
  name: rclone-config
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/instance: restic
      app.kubernetes.io/name: resticprofile
      app.kubernetes.io/component: resticprofile

images:
- name: creativeprojects/resticprofile
  newTag: 0.33.1@sha256:b919f7ae7adfa4b0900ac87ab5314fb88229698b0a8d38ebc3882a27ac9e73d1
