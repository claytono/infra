---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rest-server
  labels:
    app.kubernetes.io/instance: restic
    app.kubernetes.io/name: rest-server
    app.kubernetes.io/component: rest-server

spec:
  tls:
  - hosts:
    - restic.k.oneill.net
  rules:
  - host: restic.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rest-server
            port:
              number: 8000
