---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: semaphore-postgres

spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1
  enablePDB: true

  storage:
    size: 10Gi

  bootstrap:
    initdb:
      database: semaphore
      owner: semaphore
