---
# Source: mail/templates/statefulset.yaml
apiVersion: apps/v1
kind: "StatefulSet"
metadata:
  name: "smtp"
  namespace: "smtp-relay"
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/instance: smtp
    app.kubernetes.io/version: "5.2.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    
    # Auto-reload postfix if somebody changes a mounted config map or secret directly
    # in Kubernetes. Uses: https://github.com/stakater/Reloader
    # NOTE: only resources actually rendered are listed, and the cert secret is
    # intentionally excluded (see the note in "mail.checksums" above): it uses
    # genSignedCert and would force a reload on every upgrade.
    configmap.reloader.stakater.com/reload: "smtp"
spec:
  serviceName: smtp
  
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mail
      app.kubernetes.io/instance: smtp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail
        app.kubernetes.io/instance: smtp
      annotations:
        # Reload the Statefulset when any mounted config/secret changes on deployment.
        # Templates whose guard condition is false render empty, so their checksum is
        # stable and only changes once the resource actually starts being emitted.
        # NOTE: secret-cert.yaml is intentionally excluded: it uses genSignedCert, which
        # regenerates on every render and would force a pod restart on every upgrade.
        checksum/secret: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        checksum/configmap-metrics: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        checksum/secret-mount: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    spec:
      serviceAccountName: "smtp"
      
      
      
      
      
      
      

      # Allow up to 2 minutes for Postfix to flush / empty the queue  before shutting down the container
      terminationGracePeriodSeconds: 120
      containers:
        - name: mail
          image: "ghcr.io/bokysan/postfix:5.2.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            {}
          ports:
            - name: smtp
              containerPort: 587
              protocol: TCP
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - /scripts/healthcheck.sh
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 8
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - ps axf | fgrep -v grep | egrep -q '\{supervisord\}|/usr/bin/supervisord' && ps
                axf | fgrep -v grep | egrep -q '(/usr/lib/postfix/sbin/|/usr/libexec/postfix/)master'
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            exec:
              command:
              - sh
              - -c
              - ps axf | fgrep -v grep | egrep -q '\{supervisord\}|/usr/bin/supervisord' && ps
                axf | fgrep -v grep | fgrep -q "postfix-script" && ps axf | fgrep -v grep | fgrep
                -q 'opendkim'
            failureThreshold: 12
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            # If a container has a preStop hook configured, that runs before the container enters the Terminated state.
            preStop:
              exec:
                command:
                  - bash
                  - -c
                  - sleep 0 && touch /tmp/container_is_terminating && while ! [[ "`mailq`" == *empty* ]]; do echo "Flushing queue..." && postfix flush; sleep 1; done; killall5 -15 supervisord
          
          envFrom:
            - configMapRef:
                name: "smtp"
            - secretRef:
                name: "smtp-relay"
          volumeMounts:
            - mountPath: /var/spool/postfix
              name: "smtp"
              subPath: spool
            - name: certs
              mountPath: /var/run/certs
              readOnly: true
            - name: certs-init
              mountPath: /docker-init.d/_enable_tls.sh
              readOnly: true
              subPath: _enable_tls.sh
            - name: tmp-volume-postfix
              mountPath: /tmp
          resources: 
            {}
      volumes:
        - name: tmp-volume-postfix
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: certs-init
          configMap:
            name: smtp
            defaultMode: 0755
        - name: certs
          secret:
            secretName: smtp-certs
        # Socket directories
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: smtp
        namespace: smtp-relay
      spec:
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: "1Gi"

