---
apiVersion: v1
kind: Service

metadata:
  name: soju
  annotations:
    external-dns.alpha.kubernetes.io/hostname: soju.k.oneill.net
    external-dns.kubernetes.io/hostname: soju.k.oneill.net
    metallb.io/allow-shared-ip: plexmediaserver
    metallb.io/address-pool: shared

spec:
  type: LoadBalancer
  ipFamilyPolicy: RequireDualStack
  selector:
    app.kubernetes.io/name: soju
    app.kubernetes.io/instance: soju
  ports:
  - name: ircs
    port: 6697
    targetPort: ircs
    protocol: TCP
