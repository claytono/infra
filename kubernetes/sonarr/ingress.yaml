---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: sonarr
  labels:
    app: sonarr
  annotations:
    ak-type: basic-auth
    ak-path-exclude: /api(/|$).*
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Sonarr
    gethomepage.dev/description: TV Manager
    gethomepage.dev/group: Media Automation
    gethomepage.dev/icon: sonarr.png

spec:
  tls:
  - hosts:
    - sonarr.k.oneill.net
  rules:
  - host: sonarr.k.oneill.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr
            port:
              number: 8989
