---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: storyteller
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storyteller
      app.kubernetes.io/instance: storyteller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storyteller
        app.kubernetes.io/instance: storyteller
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: storyteller
        image: registry.gitlab.com/storyteller-platform/storyteller:web-v2.14.18@sha256:36bb96654e8a4de5e461b5185add550a0f747b6f142f3540c6313985f7b943d2
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/New_York
        - name: AUTH_URL
          value: https://storyteller.k.oneill.net/api/v2/auth
        - name: STORYTELLER_CONFIG
          value: /config/storyteller.json
        - name: STORYTELLER_DATA_DIR
          value: /data
        - name: STORYTELLER_DB_DIR
          value: /database
        - name: STORYTELLER_SECRET_KEY_FILE
          value: /run/secrets/storyteller/secret-key
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: database
          mountPath: /database
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config/storyteller.json
          subPath: storyteller.json
          readOnly: true
        - name: secrets
          mountPath: /run/secrets/storyteller
          readOnly: true
        - name: audiobooks
          mountPath: /audiobooks
          readOnly: true
        - name: ebooks
          mountPath: /ebooks
          readOnly: true
      volumes:
      - name: database
        persistentVolumeClaim:
          claimName: storyteller-database
      - name: data
        persistentVolumeClaim:
          claimName: storyteller-data
      - name: config
        configMap:
          name: storyteller-config
      - name: secrets
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: storyteller-secrets
              items:
              - key: STORYTELLER_SECRET_KEY
                path: secret-key
          - secret:
              name: storyteller-oidc
              items:
              - key: OIDC_CLIENT_ID
                path: oidc-client-id
              - key: OIDC_CLIENT_SECRET
                path: oidc-client-secret
      - name: audiobooks
        nfs:
          server: fs2.oneill.net
          path: /volume2/shared/books/audiobookshelf
          readOnly: true
      - name: ebooks
        nfs:
          server: fs2.oneill.net
          path: /volume2/shared/books/grimmory
          readOnly: true
