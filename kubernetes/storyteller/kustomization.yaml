---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: storyteller

resources:
- namespace.yaml
- password-generator.yaml
- externalsecret-secret-key.yaml
- externalsecret-oidc.yaml
- pvc-database.yaml
- pvc-data.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

configMapGenerator:
- name: storyteller-config
  files:
  - storyteller.json

generatorOptions:
  disableNameSuffixHash: true

commonAnnotations:
  argoManaged: 'true'

labels:

- pairs:
    app.kubernetes.io/name: storyteller
    app.kubernetes.io/instance: storyteller
  includeSelectors: true
