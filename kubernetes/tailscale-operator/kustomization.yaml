---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

resources:
- namespace.yaml
- externalsecret.yaml
- helm/templates/apiserverproxy-rbac.yaml
- helm/templates/deployment.yaml
- helm/templates/ingressclass.yaml
- helm/templates/oauth-secret.yaml
- helm/templates/operator-rbac.yaml
- helm/templates/proxy-rbac.yaml
- helm/templates/tailscale.com_connectors.yaml
- helm/templates/tailscale.com_dnsconfigs.yaml
- helm/templates/tailscale.com_peerrelays.yaml
- helm/templates/tailscale.com_proxyclasses.yaml
- helm/templates/tailscale.com_proxygroups.yaml
- helm/templates/tailscale.com_proxygrouppolicies.yaml
- helm/templates/tailscale.com_recorders.yaml
- helm/templates/tailscale.com_tailnets.yaml
- xtal-node-exporter.yaml

commonAnnotations:
  argoManaged: 'true'

patches:

- target:
    kind: Deployment
    name: operator
  patch: |-
    - op: add
      path: /spec/template/metadata/annotations
      value:
        reloader.stakater.com/auto: "true"
