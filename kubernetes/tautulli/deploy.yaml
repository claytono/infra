---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: tautulli

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tautulli
      app.kubernetes.io/instance: tautulli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tautulli
        app.kubernetes.io/instance: tautulli
    spec:
      containers:
      - name: tautulli
        securityContext:
          privileged: true
        image: tautulli/tautulli:v2.18.2@sha256:1b5875fe3193d450a62e7b438eb6701195c841f14f3dcb962e545eda42d3696f
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8181
        env:
        - name: TZ
          value: EST5EDT
        livenessProbe:
          httpGet:
            path: /status
            port: 8181
          failureThreshold: 3
        volumeMounts:
        - mountPath: /config
          name: config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: tautulli-config
