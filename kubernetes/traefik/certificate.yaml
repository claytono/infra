---
# Traefik serves this certificate for every k.oneill.net host through the
# default TLSStore (tlsStore in values.yaml). Ingresses keep tls.hosts so
# Homepage links to them over https, but set no secretName.
apiVersion: cert-manager.io/v1
kind: Certificate

metadata:
  name: k-oneill-net-wildcard

spec:
  secretName: k-oneill-net-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
  - '*.k.oneill.net'
