---
# Source: traefik/templates/ingressroute.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    gethomepage.dev/description: Ingress controller dashboard
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/href: https://traefik.k.oneill.net/dashboard/
    gethomepage.dev/icon: traefik.png
    gethomepage.dev/name: Traefik
    gethomepage.dev/pod-selector: app.kubernetes.io/name=traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: traefik
  entryPoints:
  - websecure
  routes:
  - match: Host(`traefik.k.oneill.net`)
    kind: Rule
    services:
      - kind: TraefikService
        name: api@internal
    middlewares:
      - name: redirect-dashboard
      - name: ak-forward-auth-simple
        namespace: authentik


