---
global:
  # SMTP relay for mail notifications
  smtp_smarthost: smtp.k.oneill.net:587
  smtp_from: alertmanager@oneill.net
  smtp_auth_username: relay@oneill.net
  smtp_auth_password_file: /etc/vm/secrets/alertmanager/SMTP_PASSWORD
  smtp_require_tls: true

# The operator adds the templates listed in vmalertmanager-alertmanager.yaml.

# The root route on which each incoming alert enters.
route:
    # The labels by which incoming alerts are grouped together. For example,
    # multiple alerts coming in for cluster=A and alertname=LatencyHigh would
    # be batched into a single group.
  group_by: ['...']

    # A default receiver
    # If an alert isn't caught by a route, send it to default.
  receiver: default

    # All the above attributes are inherited by all child routes and can
    # overwritten on each.

    # The child route trees.
  routes:
  - match:
      alertname: Watchdog
    receiver: healthchecks-watchdog
    group_wait: 0s
    group_interval: 1m
    repeat_interval: 5m
  - match:
      realert: daily
    repeat_interval: 1d

receivers:
- name: healthchecks-watchdog
  webhook_configs:
  - url_file: /etc/vm/secrets/alertmanager/HEALTHCHECKS_WATCHDOG_URL
    send_resolved: false
- name: default
  slack_configs:
  - api_url_file: /etc/vm/secrets/alertmanager/SLACK_WEBHOOK_URL
    channel: '#alerts'
    send_resolved: true
    color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    title: '{{ template "slack.alertmanager.title" . }}'
    title_link: '{{ template "slack.default.titlelink" . }}'
    text: '{{ template "slack.alertmanager.text" . }}'
- name: email
  email_configs:
  - to: clayton@oneill.net
    send_resolved: true
