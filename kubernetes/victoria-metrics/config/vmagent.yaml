---
# vmagent's hand-written scrape jobs (additionalScrapeConfigs in
# vmagent-vmagent.yaml). The scrape interval is set there. The operator
# scrapes VictoriaMetrics, vmagent, vmalert, vmauth and Alertmanager itself,
# through the VMServiceScrapes it creates for them. Node exporters are
# scraped through VMStaticScrapes: vmstaticscrape-node-exporters.yaml,
# generated from the Ansible inventory, and vmstaticscrape-xtal.yaml.

# scrape szamar via http on port 10445
- job_name: hwinfo gaming pc
  static_configs:
  - targets:
    - szamar.oneill.net:10445
    - szamar.oneill.net:4445
    - szamar.oneill.net:9835

- job_name: blackbox
  metrics_path: /probe
  basic_auth:
    username: vmagent
    password_file: /etc/vm/secrets/vmagent-scrape-credentials/blackbox-exporter-password
  params:
    module: [icmp]
  static_configs:
  - targets:
    - udmp.oneill.net
    - basement-guardian.oneill.net
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter.default.svc:9115  # The blackbox exporter's real hostname:port.

- job_name: hass
  scrape_interval: 2s
  bearer_token_file: /etc/vm/secrets/vmagent-scrape-credentials/hass-bearer-token
  metrics_path: /api/prometheus
  static_configs:
  - targets:
    - hass-home-assistant.hass:8080

- job_name: kubernetes-apiservers

  kubernetes_sd_configs:
  - role: endpointslice

  scheme: https
  # Authenticates to the apiserver with vmagent's service account.
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  # Keep only the https port of default/kubernetes: one target per apiserver.
  relabel_configs:
  - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
    action: keep
    regex: default;kubernetes;https

# Kubelet metrics, proxied through the apiserver so vmagent needs no direct
# node access.
- job_name: kubernetes-nodes

  scheme: https
  # Authenticates to the apiserver with vmagent's service account.
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  kubernetes_sd_configs:
  - role: node

  relabel_configs:
  - action: labelmap
    regex: __meta_kubernetes_node_label_(.+)
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels: [__meta_kubernetes_node_name]
    regex: (.+)
    target_label: __metrics_path__
    replacement: /api/v1/nodes/${1}/proxy/metrics

# Kubelet cAdvisor (container_*) metrics, proxied through the apiserver.
- job_name: kubernetes-cadvisor

  scheme: https
  # Authenticates to the apiserver with vmagent's service account.
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  kubernetes_sd_configs:
  - role: node

  relabel_configs:
  - action: labelmap
    regex: __meta_kubernetes_node_label_(.+)
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels: [__meta_kubernetes_node_name]
    regex: (.+)
    target_label: __metrics_path__
    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

# Scrape config for service endpoints.
#
# The relabeling allows the actual service scrape endpoint to be configured
# via the following annotations:
#
# * `prometheus.io/scrape`: Only scrape services that have a value of `true`
# * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
# to set this to `https` & most likely set the `tls_config` of the scrape config.
# * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
# * `prometheus.io/port`: If the metrics are exposed on a different port to the
# service then set this appropriately.
- job_name: kubernetes-service-endpoints
  kubernetes_sd_configs:
  - role: endpointslice

  relabel_configs:
  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
    action: keep
    regex: true
  # One target per endpoint: skip a dual-stack Service's IPv6 slice, and
  # endpoints of pods that are shutting down.
  - source_labels: [__meta_kubernetes_endpointslice_address_type]
    action: keep
    regex: IPv4
  - source_labels: [__meta_kubernetes_endpointslice_endpoint_conditions_terminating]
    action: drop
    regex: 'true'
  # Several Service ports map to the one annotated port; keep only that one.
  - action: keep_if_equal
    if: '{__meta_kubernetes_service_annotation_prometheus_io_port!="", __meta_kubernetes_pod_container_port_number!=""}'
    source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
  # CNPG inherits pod scrape annotations onto Services too; collect each pod once.
  - source_labels: [__meta_kubernetes_service_label_cnpg_io_cluster]
    action: drop
    regex: .+
  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
    action: replace
    target_label: __scheme__
    regex: (https?)
  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
    action: replace
    target_label: __metrics_path__
    regex: (.+)
  - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
    action: replace
    target_label: __address__
    regex: ([^:]+)(?::\d+)?;(\d+)
    replacement: $1:$2
  - action: labelmap
    regex: __meta_kubernetes_service_label_(.+)
  - source_labels: [__meta_kubernetes_namespace]
    action: replace
    target_label: kubernetes_namespace
  - source_labels: [__meta_kubernetes_service_name]
    action: replace
    target_label: kubernetes_name
  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape_interval]
    action: replace
    target_label: scrape_interval

# Scrape config for pods
#
# The relabeling allows the actual pod scrape endpoint to be configured via the
# following annotations:
#
# * `prometheus.io/scrape`: Only scrape pods that have a value of `true`
# * `prometheus.io/scheme`: If the metrics endpoint is secured then set this to
#   `https`.
# * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
# * `prometheus.io/port`: Scrape the pod on the indicated port instead of the
# pod's declared ports (default is a port-free target if none are declared).
- job_name: kubernetes-pods

  kubernetes_sd_configs:
  - role: pod

  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
    action: keep
    regex: true
  # Pods declaring several ports would otherwise all map to the annotated
  # port; keep only that one. A pod that declares ports must therefore list
  # its prometheus.io/port among them, or it is not scraped at all.
  - action: keep_if_equal
    if: '{__meta_kubernetes_pod_annotation_prometheus_io_port!="", __meta_kubernetes_pod_container_port_number!=""}'
    source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
  # A sidecar without ports (Alloy's config-reloader) would also map to the
  # annotated port; when the pod names a default container, keep only that one.
  - action: keep_if_equal
    if: '{__meta_kubernetes_pod_container_port_number="", __meta_kubernetes_pod_annotation_kubectl_kubernetes_io_default_container!=""}'
    source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_annotation_kubectl_kubernetes_io_default_container]
  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
    action: replace
    target_label: __scheme__
    regex: (https?)
  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
    action: replace
    target_label: __metrics_path__
    regex: (.+)
  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
    action: replace
    regex: ([^:]+)(?::\d+)?;(\d+)
    replacement: $1:$2
    target_label: __address__
  - action: labelmap
    regex: __meta_kubernetes_pod_label_(.+)
  - source_labels: [__meta_kubernetes_namespace]
    action: replace
    target_label: kubernetes_namespace
  - source_labels: [__meta_kubernetes_pod_name]
    action: replace
    target_label: kubernetes_pod_name

- job_name: metallb-pods
  scheme: https
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    insecure_skip_verify: true

  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - metallb-system
    selectors:
    - role: pod
      label: app.kubernetes.io/name=metallb,app.kubernetes.io/instance=metallb

  relabel_configs:
  - source_labels: [__meta_kubernetes_namespace]
    action: keep
    regex: metallb-system
  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance,
      __meta_kubernetes_pod_label_app_kubernetes_io_component]
    action: keep
    regex: metallb;metallb;(controller|speaker)
  - source_labels: [__meta_kubernetes_pod_phase]
    action: keep
    regex: Running
  - source_labels: [__meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_container_port_number]
    action: keep
    regex: metricshttps;7472
  - action: labelmap
    regex: __meta_kubernetes_pod_label_(.+)
  - source_labels: [__meta_kubernetes_namespace]
    action: replace
    target_label: kubernetes_namespace
  - source_labels: [__meta_kubernetes_pod_name]
    action: replace
    target_label: kubernetes_pod_name

- job_name: proxmox-cluster
  scrape_interval: 60s
  metrics_path: /pve
  params:
    cluster: ['1']
    node: ['0']
  static_configs:
  - targets:
    - p1.oneill.net
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: prometheus-pve-exporter.o11y.svc:9221

- job_name: proxmox-nodes
  scrape_interval: 60s
  metrics_path: /pve
  params:
    cluster: ['0']
    node: ['1']
  static_configs:
  - targets:
    - p1.oneill.net
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: prometheus-pve-exporter.o11y.svc:9221

- job_name: rclone-exporter
  scrape_interval: 120s
  scrape_timeout: 120s
  metrics_path: /probe
  static_configs:
  - targets:
    - "hetzner_crypt_restic_main:"
    - "hetzner_crypt_restic_xtal:"
    - "hetzner_velero:"
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_remote
  - source_labels: [__param_remote]
    target_label: instance
  - target_label: __address__
    replacement: rclone-exporter.o11y.svc:9116

- job_name: karakeep
  metrics_path: /api/metrics
  static_configs:
  - targets: [karakeep.karakeep:3000]
  bearer_token_file: /etc/vm/secrets/vmagent-scrape-credentials/karakeep-metrics-token
