---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: victoria-metrics

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
    spec:
      priorityClassName: monitoring
      containers:
      - name: victoria-metrics
        image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
        args:
        - -storageDataPath=/storage
        - -retentionPeriod=24
        - -maxLabelsPerTimeseries=100
        # Keep this flag. It hides duplicate samples left by the November 2026
        # backfill from Prometheus.
        #
        # The backfill imported 2026-11-08 01:50-24:00 UTC twice, so most series
        # store every sample in that window twice, in overlapping blocks of the
        # 2026_11 partition. Two force merges (/internal/force_merge) removed
        # only a fraction of them: merges compare copies only when they sit in
        # adjacent blocks. VictoriaMetrics can't delete a time range without
        # deleting whole series, so the copies stay.
        #
        # With this flag, every query drops samples whose timestamps are
        # identical, so counts, sums and rates over that day come out right.
        # Without it, that window counts twice.
        #
        # 1ms only ever drops samples with exactly the same timestamp, so live
        # data (scraped every 10-15 s) is never thinned, and any duplicates
        # written in the future, for example by a repeated import, are hidden
        # too. Don't raise it: a value above the 1ms recorded in every stored
        # part makes VictoriaMetrics re-deduplicate all older months at the new
        # interval, permanently thinning them.
        #
        # Cost: background merges decode and re-encode every block instead of
        # copying it, which uses more CPU.
        - -dedup.minScrapeInterval=1ms
        # Sizes the caches as a 6Gi memory limit would (60% of it), without
        # a limit that would OOM-kill VictoriaMetrics under a heavy query.
        - -memory.allowedBytes=3686MiB
        # Serves vmalert's alerts and rules at /api/v1/alerts and
        # /api/v1/rules, where kured and Grafana look for them.
        - -vmalert.proxyURL=http://vmalert:8880
        ports:
        - name: http
          containerPort: 8428
        volumeMounts:
        - name: data
          mountPath: /storage
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoria-metrics-data
