---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: vmagent
  annotations:
    # vmagent re-reads the scrape config itself; restart only for the scrape
    # credentials secret.
    secret.reloader.stakater.com/reload: vmagent

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
    spec:
      priorityClassName: monitoring
      # Scrape config is config/vmagent.yaml; scrape credentials come from the
      # vmagent Secret (externalsecret-vmagent.yaml).
      serviceAccountName: vmagent
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.155.0@sha256:8e3c03905be15bba8312d4868e8ae6f9fc2fefee0a41d544472034249ca42bb4
        args:
        - -promscrape.config=/etc/vmagent/vmagent.yaml
        - -promscrape.configCheckInterval=1m
        - -remoteWrite.url=http://victoria-metrics:8428/api/v1/write
        - -remoteWrite.tmpDataPath=/buffer
        # NFS doesn't enforce the PVC's size, so cap the buffer to match it.
        - -remoteWrite.maxDiskUsagePerURL=10GiB
        ports:
        - name: http
          containerPort: 8429
        volumeMounts:
        - name: config
          mountPath: /etc/vmagent
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: buffer
          mountPath: /buffer
      volumes:
      - name: config
        configMap:
          name: vmagent
      - name: secrets
        secret:
          secretName: vmagent
      - name: buffer
        persistentVolumeClaim:
          claimName: vmagent-buffer
