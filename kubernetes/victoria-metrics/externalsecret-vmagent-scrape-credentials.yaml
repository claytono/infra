---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: vmagent-scrape-credentials

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  data:
  - secretKey: blackbox-exporter-password
    remoteRef:
      key: blackbox-exporter-password
      property: password
  - secretKey: hass-bearer-token
    remoteRef:
      key: victoria-metrics
      property: hass-bearer-token
  - secretKey: karakeep-metrics-token
    remoteRef:
      key: karakeep
      property: prometheus_auth_token
