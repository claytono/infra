---
# The vmauth user's password, which OpenTofu generates
# (opentofu/victoria-metrics.tf). vmuser-vmauth.yaml reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: vmauth-password

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  data:
  - secretKey: password
    remoteRef:
      key: victoria-metrics-vmauth
      property: password
