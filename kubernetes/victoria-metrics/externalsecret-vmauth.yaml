---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: vmauth

spec:
  secretStoreRef:
    name: production
    kind: ClusterSecretStore
  target:
    template:
      data:
        # The vm Ingress sends only /api/ here, without the Authentik login.
        # Reads are open; writes, imports and series deletes need the vmauth
        # user. src_paths must match the whole path, and anything not listed
        # is refused.
        auth.yaml: |
          unauthorized_user:
            url_map:
            - src_paths: &read_paths
              - /api/v1/(query|query_range|query_exemplars|series|series/count|labels|label/[^/]+/values|metadata|rules|alerts|notifiers)
              - /api/v1/export(/csv|/native)?
              - /api/v1/status/.*
              url_prefix: http://victoria-metrics:8428

          users:
          - username: vmauth
            password: "{{ .password }}"
            url_map:
            - src_paths: *read_paths
              url_prefix: http://victoria-metrics:8428
            - src_paths:
              - /api/v1/write
              - /api/v1/import.*
              - /api/v1/admin/tsdb/delete_series
              url_prefix: http://victoria-metrics:8428
  data:
  - secretKey: password
    remoteRef:
      key: victoria-metrics-vmauth
      property: password
