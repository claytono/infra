---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: victoria-metrics

components:
- ../components/authentik

commonAnnotations:
  argoManaged: 'true'

resources:
- namespace.yaml
- externalsecret-alertmanager.yaml
- externalsecret-vmagent-scrape-credentials.yaml
- externalsecret-vmauth-password.yaml
- ingress-alertmanager.yaml
- ingress-vm.yaml
- pvc-victoria-metrics-data.yaml
- pvc-vmagent-buffer.yaml
- rbac.yaml
- vmagent-vmagent.yaml
- vmalert-vmalert.yaml
- vmalertmanager-alertmanager.yaml
- vmauth-vmauth.yaml
- vmrule-cluster.yaml
- vmrule-victoriametrics.yaml
- vmsingle-victoria-metrics.yaml
- vmstaticscrape-fs2.yaml
- vmstaticscrape-node-exporters.yaml
- vmstaticscrape-xtal.yaml
- vmuser-vmauth.yaml

configMapGenerator:
- name: alertmanager-templates
  files:
  - config/alertmanager-templates/default.tmpl
  - config/alertmanager-templates/slack.tmpl
  options:
    disableNameSuffixHash: true

# Neither holds a secret; the operator reads these settings from Secrets.
secretGenerator:
- name: vmagent-scrape-configs
  files:
  - config/vmagent.yaml
  options:
    disableNameSuffixHash: true
- name: alertmanager-base-config
  files:
  - alertmanager.yaml=config/alertmanager.yaml
  options:
    disableNameSuffixHash: true

labels:

- pairs:
    app.kubernetes.io/instance: victoria-metrics
  includeSelectors: true
