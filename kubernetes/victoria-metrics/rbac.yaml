---
# The operator's ClusterRole for vmagent has no nodes/proxy, which the
# kubernetes-nodes and kubernetes-cadvisor jobs use to reach the kubelets
# through the apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: vmagent-nodes-proxy

rules:
- apiGroups: ['']
  resources: [nodes/proxy]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: vmagent-nodes-proxy

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent-nodes-proxy

subjects:
- kind: ServiceAccount
  name: vmagent
  # Created by the operator, so kustomize can't fill in the namespace.
  namespace: victoria-metrics
