---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: vmagent

---
# Read access for vmagent's Kubernetes discovery, plus the kubelet proxy and
# apiserver /metrics endpoints its scrape config uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: vmagent

rules:
- apiGroups: ['']
  resources:
  - nodes
  - nodes/proxy
  - services
  - pods
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- nonResourceURLs: [/metrics]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: vmagent

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent

subjects:
- kind: ServiceAccount
  name: vmagent
