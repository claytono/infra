---
# Source: victoria-metrics-operator/templates/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmoperator
  namespace: vmoperator
  labels: 
    app.kubernetes.io/instance: vmoperator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/version: v0.75.2
spec:
  replicas: 1
  selector:
    matchLabels: 
      app.kubernetes.io/instance: vmoperator
      app.kubernetes.io/name: victoria-metrics-operator
  strategy: 
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels: 
        app.kubernetes.io/instance: vmoperator
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-operator
    spec:
      automountServiceAccountToken: true
      securityContext: 
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: vmoperator
      containers:
        - name: operator
          image: victoriametrics/operator:v0.75.2
          imagePullPolicy: IfNotPresent
          env:
            - name: VM_VMSINGLEDEFAULT_USEDEFAULTRESOURCES
              value: "false"
            - name: VM_VMAGENTDEFAULT_USEDEFAULTRESOURCES
              value: "false"
            - name: VM_VMALERTDEFAULT_USEDEFAULTRESOURCES
              value: "false"
            - name: VM_VMAUTHDEFAULT_USEDEFAULTRESOURCES
              value: "false"
            - name: VM_VMALERTMANAGER_USEDEFAULTRESOURCES
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: victoria-metrics-operator
            - name: VM_PROMETHEUSCONVERTERADDARGOCDIGNOREANNOTATIONS
              value: "true"
            - name: VM_ENABLEDPROMETHEUSCONVERTEROWNERREFERENCES
              value: "false"
          args:
            - --zap-log-level=info
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --webhook.enable=true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: probe
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /health
              port: probe
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: probe
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          resources: 
            {}
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: vmoperator-validation

