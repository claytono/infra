---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vmoperator

resources:
- namespace.yaml
- helm/crb.yaml
- helm/crd.yaml
- helm/monitor.yaml
- helm/rb.yaml
- helm/role.yaml
- helm/server.yaml
- helm/service.yaml
- helm/serviceaccount.yaml
- helm/webhook.yaml

commonAnnotations:
  argoManaged: 'true'

labels:

- pairs:
    app: vmoperator
