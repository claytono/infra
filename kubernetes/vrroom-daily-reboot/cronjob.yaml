---
apiVersion: batch/v1
kind: CronJob

metadata:
  name: vrroom-daily-reboot

spec:
  schedule: 0 5 * * *  # 5:00 AM daily in local time
  timeZone: America/New_York
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: vrroom-daily-reboot
            image: alpine:3.24@sha256:c6b073f8e9e58d881f6ffba6ebf3b9ebd60b9e7d6e8337018c0e68bb5c356873
            command: [/bin/sh, -c, echo "set reboot" | nc vrroom-37.oneill.net 2222]
          restartPolicy: Never
