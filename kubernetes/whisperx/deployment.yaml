---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: whisperx
  annotations:
    reloader.stakater.com/auto: 'true'

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: whisperx
      app.kubernetes.io/instance: whisperx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whisperx
        app.kubernetes.io/instance: whisperx
    spec:
      runtimeClassName: nvidia
      priorityClassName: gpu-priority
      containers:
      - name: whisperx
        image: learnedmachine/whisperx-asr-service:0.4.1@sha256:9b91445e462b60f430a2edf3de1e25dc09ef85078727059627400e778174e293
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: whisperx-secrets
              key: HF_TOKEN
        - name: DEVICE
          value: cuda
        - name: COMPUTE_TYPE
          value: int8
        - name: PRELOAD_MODEL
          value: large-v3
        - name: BATCH_SIZE
          value: '4'
        - name: GPU_CONCURRENCY
          value: '1'
        - name: MAX_QUEUE_SIZE
          value: '32'
        - name: HF_HOME
          value: /cache/huggingface
        - name: TORCH_HOME
          value: /cache/torch
        - name: XDG_CACHE_HOME
          value: /cache
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: cache
          mountPath: /.cache
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: whisperx-cache
